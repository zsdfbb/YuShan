[package]
name = "ys-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ys-core = { path = "../ys-core" }
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "io-util", "fs"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
