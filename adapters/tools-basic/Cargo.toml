[package]
name = "ys-tools-basic"
version.workspace = true
edition.workspace = true

[dependencies]
ys-core = { path = "../../crates/ys-core" }
ys-tool = { path = "../../crates/ys-tool" }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "io-util", "fs", "process", "signal", "macros"] }
unicode-normalization = "0.1"

[dev-dependencies]
ys-protocol = { path = "../../crates/ys-protocol" }
