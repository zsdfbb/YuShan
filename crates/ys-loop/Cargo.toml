[package]
name = "ys-loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ys-core = { path = "../ys-core" }
ys-component = { path = "../ys-component" }
ys-model = { path = "../ys-model" }
ys-tool = { path = "../ys-tool" }
ys-session = { path = "../ys-session" }
ys-event = { path = "../ys-event" }
ys-protocol = { path = "../ys-protocol" }
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
serde_json = "1"
# 并行工具批的保序并发（`stream::iter(..).buffered(n)`；**不用** spawn，见 Step 9）。
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
serde_json = "1"
