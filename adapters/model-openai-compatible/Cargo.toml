[package]
name = "ys-model-openai-compat"
version.workspace = true
edition.workspace = true

[dependencies]
ys-core = { path = "../../crates/ys-core" }
ys-model = { path = "../../crates/ys-model" }
ys-event = { path = "../../crates/ys-event" }
ys-protocol = { path = "../../crates/ys-protocol" }
ys-tool = { path = "../../crates/ys-tool" }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt", "time", "io-util", "fs", "net", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
thiserror = "2"

[dev-dependencies]
# 测试用 tokio。**不要加 `test-util`**：它只在带 dev 依赖的构建里出现，会让
# `cargo build` 与 `cargo test` 之间的 tokio 编译单元不一致，每次切换都要重编
# 整棵依赖树（实测 7~14s）。
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
