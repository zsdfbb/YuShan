[package]
name = "ys-model-openai-compat"
version.workspace = true
edition.workspace = true

[dependencies]
ys-core = { path = "../../crates/ys-core" }
ys-model = { path = "../../crates/ys-model" }
ys-event = { path = "../../crates/ys-event" }
ys-tool = { path = "../../crates/ys-tool" }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt", "time", "io-util", "fs", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
