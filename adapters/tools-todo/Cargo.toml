[package]
name = "ys-tools-todo"
version.workspace = true
edition.workspace = true

[dependencies]
ys-core = { path = "../../crates/ys-core" }
ys-tool = { path = "../../crates/ys-tool" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
# 生产代码落盘走 `std::fs`（`TodoStore::apply` 是同步签名，见设计 §7.2）；
# `macros` / `rt` 给测试的 `#[tokio::test]`，`fs` / `sync` 随本 crate 的特性集一并声明。
tokio = { version = "1", features = ["fs", "sync", "macros", "rt"] }
