[package]
name = "ys-loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ys-core = { path = "../ys-core" }
ys-component = { path = "../ys-component" }
ys-model = { path = "../ys-model" }
ys-tool = { path = "../ys-tool" }
ys-session = { path = "../ys-session" }
ys-event = { path = "../ys-event" }
ys-protocol = { path = "../ys-protocol" }
async-trait = "0.1"
thiserror = "2"
# `macros` 只为 `tokio::select!`（ADR-0055 的收场前等待要 select 唤醒与定时兜底）。
# 它**已在 dev-dependencies 的 feature 集中** ⇒ 生产/测试的 feature 并集不变，无编译单元切换成本。
tokio = { version = "1", features = ["time", "macros"] }
serde_json = "1"
# 并行工具批的保序并发（`stream::iter(..).buffered(n)`；**不用** spawn，见 Step 9）。
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
# 测试用 tokio。**不要写 `full`，也不要加 `test-util`**：这两个 feature 只在
# 带 dev 依赖的构建里出现，会让 `cargo build` 与 `cargo test`（或 `--tests`）
# 之间的 tokio 编译单元不一致 —— 每次切换都要重编整棵依赖树（实测 7~14s）。
# 保持与 `[dependencies]` 的 feature 并集一致（或为其子集）即无切换成本。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
serde_json = "1"
