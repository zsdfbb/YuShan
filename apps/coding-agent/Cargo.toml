[package]
name = "yushan-coding-agent"
version.workspace = true
edition.workspace = true

[features]
default = ["tui-ratatui"]
tui-ratatui = ["dep:ratatui", "dep:crossterm", "dep:futures"]
# tui-stdout 已移除（c 阶段）

[dependencies]
agent-core = { path = "../../crates/agent-core" }
agent-model = { path = "../../crates/agent-model" }
agent-tool = { path = "../../crates/agent-tool" }
agent-session = { path = "../../crates/agent-session" }
agent-event = { path = "../../crates/agent-event" }
agent-component = { path = "../../crates/agent-component" }
agent-loop = { path = "../../crates/agent-loop" }
agent-runtime = { path = "../../crates/agent-runtime" }
agent-model-openai-compatible = { path = "../../adapters/model-openai-compatible" }
agent-tools-basic = { path = "../../adapters/tools-basic" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "fs"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
thiserror = "2"
inquire = "0.8"
# rustyline 已移除（c 阶段——ratatui 模式通过 crossterm events 处理输入）

# 仅 ratatui 模式使用（可选依赖）
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true, features = ["event-stream"] }
futures = { version = "0.3", optional = true }

[dev-dependencies]